name: Fetch Daily Dollar Price
on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC daily

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - run: npm install node-fetch
      - run: node fetch-dollar.js
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: git config user.name "bot" && git add prices.json && git commit -m "Update prices" || true
      - run: git push

